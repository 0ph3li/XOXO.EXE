<body class="desk-mode dirty">

<!-- ░░░░░░░░░░░░░░░░░░░░░░░░ OVERLAYS ░░░░░░░░░░░░░░░░░░░░░░░░ -->
<div class="grain" aria-hidden="true"></div>

<div class="alerts"></div>
<div class="crt-off" aria-hidden="true"><p>just kidding.<br><em>you can't shut down a feeling.</em></p></div>

<!-- log on screen -->
<div class="logon" aria-hidden="true">
  <div class="logon-left">
    <p class="logon-logo">xoxo<b>labs</b></p>
    <p class="logon-hint">To begin, click your user name</p>
  </div>
  <div class="logon-right">
    <div class="user">
      <figure class="slot user-pic" data-file="img/PATCH/engineer.jpg"><img src="img/PATCH/engineer.jpg" alt=""></figure>
      <div>
        <p class="user-name">dr.m.valli</p>
        <p class="user-pass"><span class="pass-dots"></span><span class="pass-caret">|</span></p>
      </div>
    </div>
  </div>
  <p class="logon-welcome">welcome</p>
</div>

<!-- screensaver (after a while doing nothing) -->
<div class="saver" aria-hidden="true"><span class="saver-txt">xoxo.exe</span></div>

<!-- ░░░░░░░░░░░░░░░░░░░░░░░░ TASKBAR (main nav) ░░░░░░░░░░░░░░░░░░░░░░░░ -->
<nav class="taskbar" aria-label="Main">
  <button class="start is-on" aria-label="Log off — back to home">
    <span class="start-mark">♥</span><span class="start-label" data-clean="log off" data-dirty="log off">log off</span>
  </button>

  <div class="task-links">
    <a href="index.html" class="task">Home</a>
    <a href="products.html" class="task">Products</a>
    <a href="campaign.html" class="task">Campaign</a>
    <a href="archive.html" class="task">The Archive</a>
    <a href="outbreak.html" class="task">Outbreak</a>
    <a href="patch-notes.html" class="task">Patch Notes</a>
  </div>

  <div class="tray">
    <span class="tray-state"><i></i><b>dr.m.valli — logged on</b></span>
    <span class="tray-clock">00:00</span>
  </div>
</nav>

<main class="desktop" aria-label="Desktop">
  <div class="wallpaper" aria-hidden="true">
    <span class="wp-hill"></span>
    <span class="wp-logo">xoxo.exe</span>
  </div>

  <div class="icons" role="list">
    <button class="icon" data-open="feelings" role="listitem"><span class="ic ic-folder"></span><span class="ic-lbl">My Feelings</span></button>
    <button class="icon" data-open="photos" role="listitem"><span class="ic ic-folder ic-photos"></span><span class="ic-lbl">photos</span></button>
    <button class="icon" data-open="readme" role="listitem"><span class="ic ic-txt"></span><span class="ic-lbl">README_FIRST.txt</span></button>
    <button class="icon" data-open="db" role="listitem"><span class="ic ic-db"></span><span class="ic-lbl">unsent_messages.db</span></button>
    <button class="icon" data-open="cmd" role="listitem"><span class="ic ic-cmd"></span><span class="ic-lbl">cmd.exe</span></button>
    <button class="icon" data-open="jealousy" role="listitem"><span class="ic ic-exe"></span><span class="ic-lbl">jealousy_beta.exe</span></button>
    <button class="icon" data-open="private" role="listitem"><span class="ic ic-folder ic-lock"></span><span class="ic-lbl">private</span></button>
    <button class="icon" data-open="you" role="listitem"><span class="ic ic-exe ic-you"></span><span class="ic-lbl">you.exe</span></button>
    <button class="icon icon-bin" data-open="bin" role="listitem"><span class="ic ic-bin"></span><span class="ic-lbl">Recycle Bin</span></button>
  </div>

  <div class="windows"></div>
  <div class="lasso" aria-hidden="true"></div>
  <p class="desk-hint">double‑click to open · drag windows around · nobody was supposed to press start</p>
</main>
